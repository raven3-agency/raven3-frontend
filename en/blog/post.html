<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Archivo generado por scripts/build-blog.js. Redirige las URLs viejas post.html?slug=… a las páginas estáticas. -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting… — Raven3 Blog</title>
  <meta name="robots" content="noindex,follow" />
  <script>
    (function () {
      var slugs = ["cea-american-cold-chain-corporate-website","etienne-de-montebello-interactive-editorial-experience","ndb-propiedades-tokko-broker-integration","sgm-institutional-site-ecommerce-community","lassen-pharma-corporate-website-technical-seo","beforce-digital-catalog-visual-identity","okos-minimalist-institutional-website","art1-corporate-website-seo-accessibility","knots-ecommerce-product-ux","core-web-vitals-practical-guide","web-development-trends-2026","geo-generative-engine-optimization-guide","llms-txt-what-it-is-how-to-implement","shopify-vs-woocommerce-vs-custom-development","design-systems-for-web-projects"];
      var s = new URLSearchParams(location.search).get('slug');
      location.replace(s && slugs.indexOf(s) !== -1 ? '/en/blog/' + s + '.html' + location.hash : '/en/blog/');
    })();
  </script>
  <style>body{background:#04080E;color:#c8dce6;font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}a{color:#00E5C8}</style>
</head>
<body>
  <p>This article has moved. <a href="/en/blog/">Go to the blog</a></p>
</body>
</html>
