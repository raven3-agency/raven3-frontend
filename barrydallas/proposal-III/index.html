<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THE TIME BEING</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* ===== Frame (double-line feel) ===== */
      .frame {
        position: fixed;
        inset: 0px; /* margen exterior */
        border: 4px solid #fff; /* borde externo grueso */
        outline: 2px solid #fff; /* borde interno fino */
        outline-offset: -5px; /* separa el doble borde */
        margin-right: 1px;
        pointer-events: none;
        z-index: 4;
      }

      /* ===== Top & bottom bands ===== */
      .band {
        position: fixed;
        left: 12px;
        right: 12px;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        pointer-events: none;
        z-index: 5;
      }

      .band-inner {
        padding: 10px 18px;
        background: rgba(0, 0, 0, 0); /* 0.15 si querés más contraste */
        width: 100%;
        padding: 10px 18px;
        text-align: center;
      }

      /* Top title */
      .band.top {
        top: 12px;
        font-size: clamp(42px, 7vw, 86px);
        line-height: 1;
        text-align: center;
      }

      /* Bottom author */
      .band.bottom {
        bottom: 12px;
        font-size: clamp(34px, 7vw, 80px);
        line-height: 1;
        text-transform: none; /* autor como nombre propio */
      }
      .enter-btn {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.35);
        padding: 16px 28px;

        color: rgba(255, 255, 255, 0.85);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-align: center;

        cursor: pointer;
        z-index: 6;

        transition: opacity 0.25s ease, border-color 0.25s ease,
          transform 0.25s ease;
          border-radius: 25px;
      }

      .enter-btn span {
        display: block;
        margin-top: 6px;
        font-size: 11px;
        letter-spacing: 1px;
        opacity: 0.65;
        text-transform: none;
      }

      .enter-btn:hover {
        border-color: rgba(255, 255, 255, 0.85);
        transform: translate(-50%, -50%) scale(1.04);
      }

      .enter-btn:active {
        transform: translate(-50%, -50%) scale(0.98);
      }

      .enter-btn:focus {
        outline: none;
      }
      /* ===== Fade ===== */
      .fade {
        position: fixed;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 700ms ease;
        z-index: 7;
      }
      .fade.on {
        opacity: 1;
      }

      @media (max-width: 640px) {
        /* Marco un poco más fino */
        .frame {
          inset: 0px;
          border-width: 3px;
          outline-width: 2px;
          outline-offset: -5px;
        }

        /* Bandas ocupan todo el ancho */
        .band {
          left: 8px;
          right: 8px;
        }

        /* TEXTO SUPERIOR */
        .band.top .band-inner {
          font-size: clamp(26px, 9vw, 40px);
          letter-spacing: 2px;
          text-align: left; /* 👈 clave */
          white-space: normal; /* permite salto controlado */
        }

        /* TEXTO INFERIOR */
        .band.bottom .band-inner {
          font-size: clamp(22px, 9vw, 36px);
          letter-spacing: 1.5px;
          text-align: left;
          white-space: normal;
        }

        /* desactivamos justify hack en mobile */
        .band-inner::after {
          display: none;
        }
      }

      /* =========================
   INTERSTITIAL (before Page 2)
========================= */
      .interstitial {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        display: grid;
        place-items: center;
        padding: 24px;
        z-index: 20;

        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }

      .interstitial.show {
        opacity: 1;
        pointer-events: auto;
      }

      .interstitial-card {
        width: min(860px, 92vw);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 22px;
        padding: 28px 26px 22px;
        backdrop-filter: blur(10px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }

      .interstitial-text {
        color: rgba(255, 255, 255, 0.92);
        text-align: center;
        font-family: Georgia, "Times New Roman", Times, serif;
      }

      .interstitial-text h2 {
        margin: 0 0 14px;
        font-size: clamp(22px, 3.2vw, 34px);
        font-weight: 500;
      }

      .interstitial-text p {
        margin: 10px 0;
        font-size: clamp(14px, 1.9vw, 18px);
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.82);
      }

      .interstitial-text p.em {
        font-style: italic;
        color: rgba(255, 255, 255, 0.9);
      }

      /* Loader bar */
      .interstitial-loader {
        margin-top: 18px;
        display: flex;
        justify-content: center;
      }

      .interstitial-loader .bar {
        width: min(420px, 70vw);
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }

      .interstitial-loader .bar span {
        display: block;
        height: 100%;
        width: 0%;
        background: rgba(255, 255, 255, 0.92);
        transition: width 0.15s linear;
      }

      @media (max-width: 640px) {
        .interstitial-card {
          padding: 22px 18px 18px;
          border-radius: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame" aria-hidden="true"></div>

    <header class="band top">
      <div class="band-inner">THE TIME BEING</div>
    </header>

    <footer class="band bottom">
      <div class="band-inner">Etienne de Montebello</div>
    </footer>

    <button id="enterBtn" class="enter-btn" aria-label="Enter experience">
      Enter<br />
      <span>Begin the expansion</span>
    </button>

    <!-- Interstitial / Loader before Page 2 -->
    <div id="interstitial" class="interstitial" aria-hidden="true">
      <div class="interstitial-card">
        <div class="interstitial-text">
          <h2>From Darkness into Light</h2>

          <p>
            One moment.<br />
            One point.<br />
            One beginning.
          </p>

          <p class="em">
            Time does not move forward.<br />
            It expands.
          </p>

          <p>
            Darkness is not empty.<br />
            It is where form begins.
          </p>

          <p>
            Light reveals.<br />
            Form dissolves.<br />
            And returns.
          </p>
        </div>

        <div class="interstitial-loader" aria-hidden="true">
          <div class="bar"><span id="loaderBar"></span></div>
        </div>
      </div>
    </div>

    <div id="fade" class="fade"></div>

    <canvas id="c"></canvas>

    <script type="module" src="./main.js"></script>
  </body>
</html>
